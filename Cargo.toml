[workspace]
resolver = "3"
members = [
    "switzerland-power-animated",
    "switzerland-power-calc",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync"] }
itertools = "0.15.0"
derive_more = "2.1.1"
hashlink = "0.12.1"
